<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="1日5分だけ開く英語学習アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="のれん" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <title>のれん</title>
  </head>
  <body>
    <main id="app" data-screen="boot"></main>

    <!--
      残り時間のバー。画面モジュールの外に置く。
      開店中の画面が結果画面に差し替わってもバー自身は残るので、
      「時間が尽きて終わった」のか「解き終えた」のかが動きで分かる。
    -->
    <div class="timer" data-timer hidden aria-hidden="true">
      <div class="timer__track">
        <div class="timer__fill" data-timer-fill></div>
      </div>
    </div>

    <!-- 初回設定：時間帯を選ぶ -->
    <template id="tpl-onboarding">
      <div class="screen screen--pad stack">
        <header class="hero">
          <h1 class="hero__title">のれん</h1>
          <p class="lead">
            1日1回、選んだ時間帯のどこかで5分だけ開きます。<br />
            何時に開くかは、その日にならないと分かりません。
          </p>
        </header>

        <section class="card">
          <label class="field__label" for="ob-start">開く時間帯</label>
          <div class="field__row">
            <select id="ob-start" class="select" data-start></select>
            <span class="field__sep">から</span>
            <select id="ob-len" class="select" data-length></select>
            <span class="field__sep">のあいだ</span>
          </div>
          <p class="field__hint" data-hint></p>
        </section>

        <div class="grow"></div>

        <footer class="footer">
          <button class="btn btn--primary" data-next>これで始める</button>
          <p class="quiet center">あとから変えられます（変更は翌日から反映）</p>
        </footer>
      </div>
    </template>

    <!-- ホーム画面追加の案内。後回しにしない -->
    <template id="tpl-install">
      <div class="screen screen--pad stack">
        <header class="hero">
          <h1 class="hero__title">ホーム画面に追加</h1>
          <p class="lead">
            iPhone の Safari は、7日間アクセスがないサイトの保存データを消します。<br />
            ホーム画面に追加したアプリはこの対象外です。<br />
            <strong>記録を残すために、いま追加してください。</strong>
          </p>
        </header>

        <section class="card" data-ios hidden>
          <ol class="steps">
            <li>下の「共有」ボタンを押す</li>
            <li>メニューを下にたどる</li>
            <li><strong>「ホーム画面に追加」</strong>を選ぶ</li>
            <li>右上の「追加」を押す</li>
          </ol>
        </section>

        <section class="card" data-android hidden>
          <ol class="steps">
            <li>右上のメニュー（︙）を押す</li>
            <li><strong>「アプリをインストール」</strong>を選ぶ</li>
          </ol>
        </section>

        <section class="card" data-desktop hidden>
          <p class="quiet">
            この端末ではアドレスバーのインストールボタンから追加できます。
          </p>
        </section>

        <div class="grow"></div>

        <footer class="footer">
          <button class="btn btn--primary" data-install hidden>
            ホーム画面に追加
          </button>
          <button class="btn" data-skip>あとで</button>
        </footer>
      </div>
    </template>

    <!-- 閉店中。ボタンはほぼ無い -->
    <template id="tpl-closed">
      <div class="screen screen--closed">
        <header class="topbar">
          <button class="topbar__btn" data-settings aria-label="設定">設定</button>
        </header>

        <section class="card card--center next">
          <p class="next__label">次に開くのは</p>
          <p class="next__time" data-time>--:--</p>
          <p class="next__note" data-note></p>
        </section>

        <section class="card">
          <p class="card__title">今週</p>
          <div class="week" data-week aria-label="今週の記録"></div>
        </section>

        <div class="grow"></div>

        <div class="closed__foot">
          <button class="ticket" data-ticket>
            <span class="ticket__label">チケット</span>
            <span class="ticket__count" data-ticket-count>0</span>
          </button>
        </div>
      </div>
    </template>

    <!-- 開店中 -->
    <template id="tpl-open">
      <div class="screen screen--open">
        <p class="countdown" data-countdown aria-live="off">5:00</p>

        <p class="prompt" data-sentence></p>

        <!-- モードB：並べ替え。どの端末でも必ず動く方 -->
        <div class="open__mode" data-arrange hidden>
          <!-- 音読から落ちてきたときだけ、その理由をここに出す -->
          <p class="open__notice" data-notice role="status" hidden></p>

          <div class="chips chips--placed" data-placed aria-label="並べた語"></div>
          <div class="chips chips--pool" data-pool aria-label="語を選ぶ"></div>

          <div class="grow"></div>

          <div class="footer">
            <button class="btn btn--primary" data-submit disabled>できた</button>
            <button class="btn btn--flat" data-undo>ひとつ戻す</button>
          </div>
        </div>

        <!-- モードA：音読 -->
        <div class="open__mode" data-speak hidden>
          <p class="open__heard" data-heard aria-live="polite"></p>

          <p class="quiet open__honest">
            発音の良し悪しは判定していません。認識器が聞き取れたかどうかだけを見ています。
          </p>

          <div class="grow"></div>

          <div class="footer">
            <button class="btn btn--primary" data-mic>話す</button>
            <div class="footer__row">
              <button class="btn btn--flat" data-replay>もう一度聞く</button>
              <button class="btn btn--flat" data-to-arrange>並べ替えにする</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- 結果。3秒で閉店中に戻る -->
    <template id="tpl-result">
      <div class="screen result">
        <div class="grow"></div>

        <p class="en result__sentence" data-sentence></p>

        <!-- 自分が出した答え。原文より小さく、下に置く -->
        <p class="result__answer" data-answer hidden>
          <span class="result__answer-label" data-answer-label></span>
          <span data-answer-text></span>
        </p>

        <p class="ja center" data-ja></p>

        <p class="quiet center result__honest" data-honest hidden>
          発音の良し悪しは判定していません。認識器が聞き取れたかどうかだけを見ています。
        </p>

        <div class="grow"></div>

        <!-- 結果の帯。色は判定にだけ対応させる -->
        <div class="band" data-band>
          <p class="band__verdict" data-verdict></p>
          <p class="band__score" data-score></p>
        </div>
      </div>
    </template>

    <!-- 設定 -->
    <template id="tpl-settings">
      <div class="screen stack">
        <header class="topbar">
          <button class="topbar__btn" data-back aria-label="戻る">戻る</button>
        </header>

        <h1 class="title">設定</h1>

        <section class="card">
          <label class="field__label" for="st-start">開く時間帯</label>
          <div class="field__row">
            <select id="st-start" class="select" data-start></select>
            <span class="field__sep">から</span>
            <select id="st-len" class="select" data-length></select>
            <span class="field__sep">のあいだ</span>
          </div>
          <p class="field__hint" data-hint></p>
          <button class="btn" data-apply>変更する</button>
          <p class="note" data-pending hidden></p>
        </section>

        <section class="card">
          <label class="field__label" for="st-mode">出題のしかた</label>
          <div class="field__row">
            <select id="st-mode" class="select" data-mode>
              <option value="arrange">並べ替え</option>
              <option value="speak">音読</option>
            </select>
          </div>
          <p class="field__hint" data-mode-hint></p>
        </section>

        <section class="card">
          <p class="field__label">記録の控え</p>
          <div class="field__row field__row--split">
            <button class="btn" data-export>書き出す</button>
            <button class="btn" data-import>読み込む</button>
          </div>
          <input
            class="visually-hidden"
            type="file"
            accept="application/json,.json"
            data-import-file
          />
          <p class="field__hint" data-transfer-hint>
            記録はこの端末の中だけにあります。書き出したファイルが唯一の控えです。
          </p>
        </section>

        <section class="card">
          <p class="field__label">ホーム画面</p>
          <button class="btn" data-install-guide>追加のしかた</button>
          <p class="field__hint">
            iPhone では、追加しないと7日で記録が消えることがあります。
          </p>
        </section>

        <div class="grow"></div>

        <div class="credits quiet">
          <p>
            例文は
            <a href="https://tatoeba.org" target="_blank" rel="noreferrer noopener"
              >Tatoeba Project</a
            >
            より。ライセンスは
            <a data-license target="_blank" rel="noreferrer noopener">CC-BY 2.0 FR</a>。
          </p>
          <p>
            <a href="/data/ATTRIBUTION.txt" target="_blank" rel="noreferrer noopener"
              >出典の一覧</a
            >
          </p>
        </div>
      </div>
    </template>

    <!--
      メンテナンス中。のれんの意匠は使わない。
      サーバ側の1枚（functions/_middleware.ts）と同じ見た目にしてある。
    -->
    <template id="tpl-maintenance">
      <div class="maint">
        <div class="maint__card">
          <h1 class="maint__title" data-title></h1>
          <p class="maint__lines" data-lines></p>
          <p class="maint__message" data-message hidden></p>
        </div>
      </div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
